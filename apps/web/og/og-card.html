<!doctype html>
<!-- Source for public/og.png (1200×630 social card). Regenerate with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
       --headless --screenshot=../public/og.png --window-size=1200,630 \
       --hide-scrollbars --virtual-time-budget=8000 og-card.html
     Mirrors the landing exactly: same palette (:root in globals.css), same faces
     (EB Garamond / Archivo / JetBrains Mono), the hero lockup (Slope mark + serif
     wordmark), the red CTA chip, and "the glare" cover study inlined on the right
     (inlined so the card has no external asset dependency besides fonts). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root {
    /* the landing's palette (globals.css) */
    --ink: #0A0A0A;
    --paper: #FFFFFF;
    --red: #E8584F;
    --muted: #585858;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* The page scrolls normally so a human can inspect the whole card in any window;
     only .card is fixed at 1200×630 (the headless screenshot crops to exactly that). */
  body { background: #ddd; font-family: 'EB Garamond', Georgia, serif; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }

  /* The cover panel: the-glare (400×600) at full card height, flush right. */
  .cover { position: absolute; right: 0; top: 0; width: 420px; height: 630px; }
  .cover svg { width: 420px; height: 630px; display: block; }

  .col { position: absolute; left: 84px; top: 0; height: 100%; width: 660px; }

  /* The navbar lockup (SiteNav .brand): the-climb mark + serif wordmark, scaled up.
     Baseline-aligned optically: the mark's flat base sits ON the text baseline
     (flex-end + a margin matching the 56px Garamond descender, ≈0.21em). */
  .lockup { position: absolute; top: 60px; left: 0; display: flex; align-items: flex-end; gap: 24px; }
  .lockup svg { width: 56px; height: 56px; display: block; margin-bottom: 12px; }
  .lockup .wordmark {
    font-family: 'EB Garamond', Georgia, serif;
    font-weight: 500; font-size: 56px; line-height: 0.92; letter-spacing: -0.03em;
    color: var(--ink);
  }

  .headline {
    position: absolute; top: 216px; left: 0; width: 660px;
    font-size: 78px; font-weight: 500; line-height: 1.04;
    color: var(--ink); letter-spacing: -0.01em;
  }
  .headline em { font-style: italic; font-weight: 500; }

  .sub {
    position: absolute; top: 422px; left: 0;
    font-family: 'Archivo', 'Helvetica Neue', sans-serif;
    font-weight: 400; font-size: 28px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* The landing CTA chip: mono on red, white text (globals.css .cta). */
  .cta {
    position: absolute; bottom: 72px; left: 0;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500; font-size: 22px;
    background: var(--red); color: #fff;
    padding: 15px 28px;
    white-space: nowrap;
  }
</style>
</head>
