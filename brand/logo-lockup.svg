<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" role="img" aria-label="Camus wordmark lockup">
  <!-- Canonical lockup: The Slope + CAMUS in letterspaced caps.
       Single ink #0B0B16; invert to #F4F1E8 on ink grounds. -->
  <g>
    <polygon points="0,120 120,120 120,0" fill="#0B0B16"/>
    <circle cx="71" cy="35" r="11.5" fill="#0B0B16"/>
  </g>
  <text x="156" y="78" font-family="Archivo, Inter, -apple-system, 'Helvetica Neue', sans-serif"
        font-size="40" font-weight="600" letter-spacing="14" fill="#0B0B16">CAMUS</text>
</svg>
