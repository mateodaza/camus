<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Camus mark: the collar">
  <!-- B. THE COLLAR — the silhouette, abstracted: popped trench collar as two
       sharp points flanking a detached head. Figurative enough to evoke the man,
       geometric enough to live beside the cover motif. One ink. -->
  <circle cx="60" cy="24" r="11" fill="#0B0B16"/>
  <polygon points="20,118 40,50 46,20 52,48 60,58 68,48 74,20 80,50 100,118" fill="#0B0B16"/>
</svg>
